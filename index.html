<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e67e22">
  <title>Tablero General · Impulso Petén</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root { --naranja:#e67e22; --texto:#1f2937; --suave:#6b7280; --fondo:#f5f6f8; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; background:var(--fondo); color:var(--texto);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ip-centro { min-height:100%; display:flex; align-items:center; justify-content:center; padding:16px; }
    .ip-caja { background:#fff; border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.08);
      padding:28px 24px; width:100%; max-width:360px; text-align:center; }
    .ip-logo { width:64px; height:64px; margin:0 auto 12px; display:block; }
    h1 { font-size:19px; margin:0 0 4px; }
    p { margin:0 0 18px; color:var(--suave); font-size:14px; line-height:1.4; }
    input { width:100%; font-size:16px; padding:12px 14px; border:1.5px solid #d1d5db; border-radius:12px;
      outline:none; text-align:center; letter-spacing:.06em; }
    input:focus { border-color:var(--naranja); }
    button { margin-top:12px; width:100%; font-size:15px; font-weight:600; padding:12px; border:0;
      border-radius:12px; background:var(--naranja); color:#fff; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .ip-error { color:#c0392b; font-size:13px; min-height:18px; margin-top:10px; }
    .ip-giro { width:38px; height:38px; border-radius:50%; border:4px solid #f3d3b5;
      border-top-color:var(--naranja); animation:ipg .8s linear infinite; margin:0 auto 14px; }
    @keyframes ipg { to { transform:rotate(360deg); } }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <div class="ip-centro" id="ip-carga">
    <div class="ip-caja">
      <div class="ip-giro"></div>
      <h1>Cargando la app…</h1>
      <p id="ip-carga-txt">Un momento, por favor.</p>
    </div>
  </div>

  <div class="ip-centro" id="ip-gate" hidden>
    <form class="ip-caja" id="ip-form" autocomplete="off">
      <img class="ip-logo" src="icon.svg" alt="">
      <h1>Tablero General</h1>
      <p>Escribe el código de acceso del equipo. Solo se pide una vez en este dispositivo.</p>
      <input id="ip-codigo" type="password" placeholder="Código de acceso" required>
      <button id="ip-btn" type="submit">Entrar</button>
      <div class="ip-error" id="ip-error"></div>
    </form>
  </div>

<script>
/*
 * PÁGINA WEB DE LA APP (GitHub Pages)
 * Esta página solo es la "cáscara": pide la app completa a Apps Script y la dibuja.
 * Cada vez que se publica una versión nueva en Apps Script, esta página la toma sola:
 * no hace falta volver a subir nada a GitHub.
 * Si cambia el enlace /exec de la implementación, cambia solo API_URL.
 */
const API_URL = 'https://script.google.com/macros/s/AKfycbzSg65mlWvrBnITUaCIX6QS-_tBGHFbaP3XMXttW81AJYu5dewTqkNmThdQrEBJNlzP/exec';

const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

// Reemplazo de google.script.run: cada llamada viaja como POST a Apps Script.
// Se inyecta dentro de la app para que funcione igual que en Apps Script.
function instalarPuente(API_URL) {
  function token() { try { return localStorage.getItem('ip_token') || ''; } catch (e) { return ''; } }
  function llamar(fn, args, ok, fail, uo) {
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args, token: token() })
    }).then(function (r) {
      if (!r.ok) throw new Error('Error de conexión (' + r.status + ')');
      return r.json();
    }).then(function (j) {
      if (j.ok) {
        var res = j.result;
        // En la página web, "actualizar" es recargar esta misma página
        if (fn === 'obtenerInfoVersion' && res) res.link = '';
        if (ok) ok(res, uo);
        return;
      }
      if (j.auth === false) { try { localStorage.removeItem('ip_token'); } catch (e) {} location.reload(); return; }
      var err = new Error(j.error || 'Error en el servidor');
      if (fail) fail(err, uo); else console.error(err);
    }).catch(function (err) {
      if (!(err instanceof Error)) err = new Error(String(err));
      if (/Failed to fetch|NetworkError|Load failed/i.test(err.message)) err = new Error('Sin conexión con el servidor. Revisa tu internet e intenta de nuevo.');
      if (fail) fail(err, uo); else console.error(err);
    });
  }
  function corredor(ok, fail, uo) {
    return new Proxy({}, {
      get: function (_, p) {
        if (p === 'withSuccessHandler') return function (f) { return corredor(f, fail, uo); };
        if (p === 'withFailureHandler') return function (f) { return corredor(ok, f, uo); };
        if (p === 'withUserObject') return function (o) { return corredor(ok, fail, o); };
        if (typeof p !== 'string' || p === 'then') return undefined;
        return function () { llamar(p, Array.prototype.slice.call(arguments), ok, fail, uo); };
      }
    });
  }
  window.google = window.google || {};
  window.google.script = {
    run: corredor(),
    host: { close: function () {}, setHeight: function () {}, setWidth: function () {}, editor: { focus: function () {} } },
    url: { getLocation: function (cb) { cb({ hash: location.hash.slice(1), parameter: {}, parameters: {} }); } }
  };
}

async function api(fn, extra) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ fn: fn, args: [], token: LS.get('ip_token') || '' }, extra || {}))
  });
  if (!r.ok) throw new Error('Error de conexión (' + r.status + ')');
  const j = await r.json();
  if (!j.ok) { const e = new Error(j.error || 'Error'); e.auth = j.auth === false; throw e; }
  return j.result;
}

function mostrar(id) {
  document.getElementById('ip-carga').hidden = id !== 'carga';
  document.getElementById('ip-gate').hidden = id !== 'gate';
}

function mostrarGate(msg) {
  mostrar('gate');
  document.getElementById('ip-error').textContent = msg || '';
  document.getElementById('ip-btn').disabled = false;
  document.getElementById('ip-codigo').focus();
}

function pintar(html) {
  const extra =
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<meta name="theme-color" content="#e67e22">' +
    (/<title>/i.test(html) ? '' : '<title>Tablero General</title>') +
    '<link rel="manifest" href="manifest.webmanifest">' +
    '<link rel="icon" href="icon.svg" type="image/svg+xml">' +
    '<link rel="apple-touch-icon" href="icon.svg">' +
    '<script>(' + instalarPuente.toString() + ')(' + JSON.stringify(API_URL) + ');<\/script>';
  html = html.replace(/<base[^>]*>/i, '').replace(/<head[^>]*>/i, m => m + extra);
  document.open();
  document.write(html);
  document.close();
}

async function arrancar() {
  if (!LS.get('ip_token')) return mostrarGate();
  mostrar('carga');
  let v = Number(LS.get('ip_app_v')) || 0;
  let html = v ? LS.get('ip_app_html') : null;
  if (!html) v = 0;
  if (!v) document.getElementById('ip-carga-txt').textContent = 'La primera vez tarda unos segundos más.';
  try {
    const r = await api('__app', { v: v });
    if (!r.igual) {
      html = r.html;
      if (!(LS.set('ip_app_html', html) && LS.set('ip_app_v', String(r.version)))) { LS.del('ip_app_html'); LS.del('ip_app_v'); }
    }
  } catch (e) {
    if (e.auth) { LS.del('ip_token'); return mostrarGate(e.message); }
    if (!html) { mostrar('carga'); document.querySelector('#ip-carga h1').textContent = 'No se pudo cargar';
      document.getElementById('ip-carga-txt').textContent = e.message + ' — recarga la página para intentar de nuevo.';
      document.querySelector('.ip-giro').hidden = true; return; }
    // sin internet: se abre la última versión guardada
  }
  pintar(html);
}

document.getElementById('ip-form').addEventListener('submit', ev => {
  ev.preventDefault();
  const c = document.getElementById('ip-codigo').value.trim();
  if (!c) return;
  document.getElementById('ip-btn').disabled = true;
  document.getElementById('ip-error').textContent = '';
  LS.set('ip_token', c);
  arrancar();
});

arrancar();
</script>
</body>
</html>
